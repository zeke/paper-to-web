<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Paper</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				overscroll-behavior: none;
				background: #282828;
			}
			#canvas {
				position: fixed;
				inset: 0;
				overflow: hidden;
				touch-action: none;
				user-select: none;
				-webkit-user-select: none;
				-webkit-touch-callout: none;
				cursor: grab;
			}
			#canvas.dragging {
				cursor: grabbing;
			}
			#canvas > * {
				position: absolute;
				top: 0;
				left: 0;
				transform-origin: 0 0;
			}
			#canvas img {
				display: block;
				pointer-events: none;
			}
			.label {
				color: #a5a5a5;
				font: 12px/16px Inter, system-ui, -apple-system, sans-serif;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				pointer-events: none;
			}
		</style>
	</head>
	<body>
		<div id="canvas"></div>
		<script type="module" src="/viewer.js"></script>
	</body>
</html>
